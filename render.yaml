services:
  - type: web
    name: options-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 50
    plan: free
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: SCREENER_WORKER_ENABLED
        value: "0"
      - key: MAX_SCREENER_SCAN_TICKERS
        value: "60"
